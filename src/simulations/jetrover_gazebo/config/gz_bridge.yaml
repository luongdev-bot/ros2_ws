# NOTE: topic names below match the explicit <topic> overrides set in
# jetrover_description/urdf/gazebo.urdf.xacro. Verified against `gz topic -l`
# after a live spawn - see jetrover_gazebo/README notes if you change the URDF.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS

# SceneBroadcaster already computes this stream for the Gazebo GUI.  Bridge it
# lazily with depth-one queues so the grasp attacher sees current model poses
# without adding a per-block Gazebo plugin or accumulating stale samples.
- ros_topic_name: "/world/color_blocks_world/dynamic_pose/info"
  gz_topic_name: "/world/color_blocks_world/dynamic_pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS
  subscriber_queue: 1
  publisher_queue: 1
  lazy: true

- ros_topic_name: "/world/warehouse/dynamic_pose/info"
  gz_topic_name: "/world/warehouse/dynamic_pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS
  subscriber_queue: 1
  publisher_queue: 1
  lazy: true

# The /grasp/entity_command ROS_TO_GZ bridge is declared positionally in
# gazebo_arm.launch.py because this ros_gz_bridge version ignores its YAML
# direction when the bridge also has positional arguments.

- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "ignition.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/depth_cam/image"
  gz_topic_name: "/depth_cam/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/depth_cam/depth_image"
  gz_topic_name: "/depth_cam/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/depth_cam/camera_info"
  gz_topic_name: "/depth_cam/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS
