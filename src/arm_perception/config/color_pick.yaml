# Colour thresholds and the action group each colour triggers.
#
# LAB bounds are OpenCV 8-bit: L 0..255, a 0..255 (128 neutral),
# b 0..255 (128 neutral). Thresholds are deliberately wide on L and tight
# on a/b - lightness swings with shadow, chromaticity does not.
#
# TUNING: these values were derived from the block materials in
# jetrover_gazebo/worlds/color_blocks_world.sdf and are a *starting
# point*. On real hardware, or after changing the world lighting, read
# the actual values off a block:
#
#   ros2 topic echo /color_pick/detections          # is it detected at all?
#   ros2 run rqt_image_view rqt_image_view          # view /color_pick/debug_image
#
# then widen the offending channel. A colour that never fires is usually
# too tight on `a`; a colour that fires on the floor is too wide on both.
#
# Each colour plays a two-step sequence: a shared `motion` (the grasp) then
# an optional colour-specific `place` (drop in that colour's bin). The place
# step starts only after the grasp succeeds; drop the `place` key for a
# pick-only colour. `motion`/`place` name .d6a files in the action-group
# library (~/ActionGroups by default - see arm_motion's `library_dir`).
# `duration_ms`/`place_duration_ms: 0` keep the timings recorded in the .d6a.
#
# OPEN-LOOP CAVEAT: this dispatches FIXED action groups; it does not steer the
# arm to the detected pixel. `pick.d6a` grasps one taught point - in
# color_blocks_world.sdf that is exactly where block_blue sits (0.025, -0.245).
# So the intended demo is "put one block on the grasp point, the camera reads
# its colour, the arm places it in the matching bin", one block at a time.
#
# PLACEHOLDER: the `place` groups below (place_left/center/center1/right) are
# NOT yet taught to the four colour bins (bin_red/green/blue/yellow at
# y = -0.46); place_center1 and place_right currently resolve to the same pose.
# Re-teach one place group per bin with the arm editor, then point each colour
# at its own, or the block will be dropped in the wrong place.

# `min_area_px` / `max_area_px` bound the blob size, measured on the 320x240
# processing frame (a 4 cm block is roughly 1400-1800 px there). The upper
# bound exists because the detector takes the largest matching blob: without
# it a same-coloured surface bigger than the block - a tray, a painted wall -
# would win and the arm would be sent to grasp its centroid.
#
# CAVEAT: in color_blocks_world.sdf the sorting bins measure 1280-1560 px,
# i.e. the same order as the blocks, so this bound does NOT separate them.
# Blocks currently win only by a small margin. If a bin ever gets picked as
# the target, restrict the search to the lower part of the frame or move the
# bins out of view.

colors:
  red:
    lab_min: [40, 150, 140]
    lab_max: [255, 255, 255]
    min_area_px: 200
    max_area_px: 6000
    motion: pick
    duration_ms: 0
    place: place_left        # PLACEHOLDER - re-teach to bin_red
    place_duration_ms: 0

  green:
    lab_min: [40, 0, 140]
    lab_max: [255, 105, 255]
    min_area_px: 200
    max_area_px: 6000
    motion: pick
    duration_ms: 0
    place: place_center      # PLACEHOLDER - re-teach to bin_green
    place_duration_ms: 0

  blue:
    lab_min: [20, 120, 0]
    lab_max: [255, 215, 105]
    min_area_px: 200
    max_area_px: 6000
    motion: pick
    duration_ms: 0
    place: place_center1     # PLACEHOLDER - re-teach to bin_blue
    place_duration_ms: 0

  yellow:
    lab_min: [80, 108, 165]
    lab_max: [255, 145, 255]
    min_area_px: 200
    max_area_px: 6000
    motion: pick
    duration_ms: 0
    place: place_right       # PLACEHOLDER - re-teach to bin_yellow
    place_duration_ms: 0
